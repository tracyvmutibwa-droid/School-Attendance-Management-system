<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management - Attendance System</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Header Navigation -->
    <div class="header-bar">
        <div class="header-title">
            🎓 Cavendish University Attendance System
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="teachers.html">Teachers</a>
            <a href="attendance.html" class="active">Attendance</a>
            <a href="reports.html">Reports</a>
            <a href="#" onclick="logoutUser()" class="btn-logout">Logout</a>
        </div>
    </div>

    <div class="container">

        <div class="page-title-box">
            <h1>Attendance Management</h1>
            <p>Record daily student attendance status</p>
        </div>

        <!-- Record Attendance Form Card -->
        <div class="card">
            <h2 style="margin-bottom: 15px; color: var(--primary-color);">Record Student Attendance</h2>

            <form id="attendanceForm" onsubmit="handleRecordAttendance(event)">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;">
                    
                    <div class="form-group">
                        <label for="student_id">Select Student *</label>
                        <select id="student_id" required>
                            <option value="">Loading students...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="status">Attendance Status *</label>
                        <select id="status" required>
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Late">Late</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="btn" style="margin-top: 10px;">📌 Save Attendance Record</button>
            </form>
        </div>

        <!-- Recent Attendance Logs Card -->
        <div class="card">
            <h2 style="margin-bottom: 15px; color: var(--primary-color);">Recent Attendance Logs</h2>
            
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <!-- Loaded dynamically from JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/attendance.js"></script>

</body>
</html>
