<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Attendance System</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Header Navigation -->
    <div class="header-bar">
        <div class="header-title">
            🎓 Cavendish University Attendance System
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html" class="active">Students</a>
            <a href="teachers.html">Teachers</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html">Reports</a>
            <a href="#" onclick="logoutUser()" class="btn-logout">Logout</a>
        </div>
    </div>

    <div class="container">

        <div class="page-title-box">
            <h1>Student Management</h1>
            <p>Add new students and manage existing student records</p>
        </div>

        <!-- Add Student Form Card -->
        <div class="card">
            <h2 style="margin-bottom: 15px; color: var(--primary-color);">Add New Student</h2>

            <form id="studentForm" onsubmit="handleAddStudent(event)">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;">
                    
                    <div class="form-group">
                        <label for="student_id">Student ID *</label>
                        <input type="text" id="student_id" placeholder="e.g. ST004" required>
                    </div>

                    <div class="form-group">
                        <label for="first_name">First Name *</label>
                        <input type="text" id="first_name" placeholder="First Name" required>
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name *</label>
                        <input type="text" id="last_name" placeholder="Last Name" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="class">Class / Grade *</label>
                        <input type="text" id="class" placeholder="e.g. Grade 10" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="e.g. 0712345678">
                    </div>

                </div>

                <button type="submit" class="btn" style="margin-top: 10px;">➕ Add Student</button>
            </form>
        </div>

        <!-- Student List Table Card -->
        <div class="card">
            <h2 style="margin-bottom: 15px; color: var(--primary-color);">Registered Students</h2>
            
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Student ID</th>
                            <th>Full Name</th>
                            <th>Gender</th>
                            <th>Class</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <!-- Loaded dynamically from JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/students.js"></script>

</body>
</html>
