<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Attendance Management System</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-body">

    <div class="login-card">

        <img src="../images/cavendish-logo.png" alt="Cavendish University Logo" class="login-logo">
        <h1>School Attendance System</h1>
        <p>Please enter your credentials to login</p>

        <!-- Alert Error Message Container -->
        <div id="alert-message" class="alert-message"></div>

        <form onsubmit="loginUser(event)">

            <div class="form-group" style="text-align: left;">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username (e.g. admin)"
                    required
                >
            </div>

            <div class="form-group" style="text-align: left;">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password (e.g. admin123)"
                    required
                >
            </div>

            <button type="submit" class="btn btn-block">Login</button>

        </form>

    </div>

    <!-- Configuration & Login Script -->
    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>

</body>

</html>
